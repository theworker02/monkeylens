name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "3.5"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 3

      - name: Verify bundle
        run: bundle check

      - name: Run tests
        run: bundle exec rake test

      - name: Build gem
        run: bundle exec rake build

      - name: Run CLI doctor
        run: bundle exec ruby -Ilib exe/monkeylens doctor
