name: Verify Ruby 3.5 fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ruby35.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.5"
          bundler-cache: true
          cache-version: 2
      - name: Run exact failing command
        run: bundle exec rake test
      - name: Build gem
        run: bundle exec rake build
      - name: Run CLI doctor
        run: bundle exec ruby -Ilib exe/monkeylens doctor
      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verification
          cat > .verification/ruby-3.5.json <<'JSON'
          {
            "ruby": "3.5",
            "command": "bundle exec rake test",
            "result": "passed",
            "gem_build": "passed",
            "cli_doctor": "passed"
          }
          JSON
          rm -f .github/workflows/verify-ruby35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record successful Ruby 3.5 verification"
          git push origin main
