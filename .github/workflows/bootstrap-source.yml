name: Bootstrap complete MonkeyLens source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/source.b64"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monkeylens-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.b64 > /tmp/monkeylens-source.tar.gz
          tar -xzf /tmp/monkeylens-source.tar.gz -C .
          chmod +x exe/monkeylens bin/console bin/setup
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tests and package
        shell: bash
        run: |
          set -euo pipefail
          bundle exec rake test
          bundle exec gem build monkey_lens.gemspec
          bundle exec ruby -Ilib exe/monkeylens doctor
          bundle exec ruby -Ilib exe/monkeylens capture --config .monkeylens.yml --output /tmp/monkeylens.json
          bundle exec ruby -Ilib exe/monkeylens check --config .monkeylens.yml --baseline /tmp/monkeylens.json

      - name: Publish verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete MonkeyLens gem"
          git push origin main
