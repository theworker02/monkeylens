name: Finalize MonkeyLens v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v0.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 2

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ilib -rmonkey_lens/version -e 'print MonkeyLens::VERSION')
          test "$VERSION" = "0.1.0"
          bundle exec rake test
          bundle exec rake build
          bundle exec ruby -Ilib exe/monkeylens doctor
          test -f pkg/monkey_lens-0.1.0.gem
          sha256sum pkg/monkey_lens-0.1.0.gem > pkg/monkey_lens-0.1.0.sha256

      - name: Create semantic tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
          else
            git tag -a v0.1.0 -m "MonkeyLens v0.1.0"
            git push origin v0.1.0
          fi

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 pkg/monkey_lens-0.1.0.gem pkg/monkey_lens-0.1.0.sha256 --clobber
          else
            gh release create v0.1.0 \
              pkg/monkey_lens-0.1.0.gem \
              pkg/monkey_lens-0.1.0.sha256 \
              --title "MonkeyLens v0.1.0" \
              --notes-file <(sed -n '/## 0.1.0/,$p' CHANGELOG.md)
          fi

      - name: Record completion and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          cat > .release-status/v0.1.0.json <<'JSON'
          {
            "version": "v0.1.0",
            "tag": "published",
            "github_release": "published",
            "gem_asset": "monkey_lens-0.1.0.gem",
            "checksum_asset": "monkey_lens-0.1.0.sha256",
            "rubygems": "awaiting trusted publisher configuration"
          }
          JSON
          rm -f .github/workflows/finalize-v0.1.0.yml
          git add -A
          git commit -m "Record MonkeyLens v0.1.0 GitHub release"
          git push origin HEAD:main
