name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".release-trigger/0.2.0"
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out selected tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.confirm_version }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out pushed ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 3
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.confirm_version }}"
            TAG="v${VERSION}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            TAG="v0.2.0"
            VERSION="0.2.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tagged version and test
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ilib -rmonkey_lens/version -e 'print MonkeyLens::VERSION')
          test "$VERSION" = "$RELEASE_VERSION"
          bundle exec rake test
          bundle exec rake build
          test -f "pkg/monkey_lens-${RELEASE_VERSION}.gem"
          ruby -Ilib -e 'require "monkey_lens"; abort unless defined?(MonkeyLens::Policy)'
      - name: Finalize semantic tag
        if: github.event_name == 'push' && github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .release-trigger/0.2.0
          git add -A
          git commit -m "Prepare MonkeyLens 0.2.0 release"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" -m "MonkeyLens 0.2.0"
            git push origin "$RELEASE_TAG"
          fi
      - name: Publish with RubyGems Trusted Publishing
        uses: rubygems/release-gem@v1
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "pkg/monkey_lens-${RELEASE_VERSION}.gem" --clobber
          else
            gh release create "$RELEASE_TAG" "pkg/monkey_lens-${RELEASE_VERSION}.gem" \
              --verify-tag --generate-notes --title "MonkeyLens ${RELEASE_TAG}"
          fi
