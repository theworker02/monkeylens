name: Publish to RubyGems

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.confirm_version }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 2
      - name: Verify tagged version and test
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ilib -rmonkey_lens/version -e 'print MonkeyLens::VERSION')
          test "$VERSION" = "${{ inputs.confirm_version }}"
          bundle exec rake test
          bundle exec rake build
      - name: Publish with RubyGems Trusted Publishing
        uses: rubygems/release-gem@v1
