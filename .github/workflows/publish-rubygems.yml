name: Publish to RubyGems

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 2
      - name: Verify version and test
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ilib -rmonkey_lens/version -e 'print MonkeyLens::VERSION')
          test "$VERSION" = "${{ inputs.confirm_version }}"
          bundle exec rake test
          bundle exec rake build
      - name: Publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gem push "pkg/monkey_lens-${{ inputs.confirm_version }}.gem"
