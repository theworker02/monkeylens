name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out selected tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.confirm_version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 3
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.confirm_version }}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tagged version and test
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ilib -rmonkey_lens/version -e 'print MonkeyLens::VERSION')
          test "$VERSION" = "$RELEASE_VERSION"
          bundle exec rake test
          bundle exec rake build
          test -f "pkg/monkey_lens-${RELEASE_VERSION}.gem"
          ruby -Ilib -e 'require "monkey_lens"; abort unless defined?(MonkeyLens::Policy)'
      - name: Publish with RubyGems Trusted Publishing
        uses: rubygems/release-gem@v1
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "pkg/monkey_lens-${RELEASE_VERSION}.gem" --clobber
          else
            gh release create "$RELEASE_TAG" "pkg/monkey_lens-${RELEASE_VERSION}.gem" \
              --verify-tag --generate-notes --title "MonkeyLens ${RELEASE_TAG}"
          fi
