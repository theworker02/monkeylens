    <path d="M331 321 456 446" stroke="#f97316" stroke-width="42" stroke-linecap="round"/>
    <path d="M142 208c35-70 137-81 185-18-44 69-139 78-185 18Z" fill="#0f172a" stroke="#fdba74" stroke-width="13"/>
